# A5 — Apache httpd as a reverse proxy in front of the demo host.
#
# A whole httpd.conf rather than a drop-in, because the stock one in the
# alpine image loads a document root and a dozen modules this does not want.
# ${DEMO_HOST} is httpd's own expansion of an environment variable.

ServerName proxy
Listen 80

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule proxy_module          modules/mod_proxy.so
LoadModule proxy_http_module     modules/mod_proxy_http.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn

<Directory />
    AllowOverride none
    Require all denied
</Directory>

ProxyRequests   Off
ProxyPreserveHost On
ProxyTimeout    30

ProxyPass        / http://${DEMO_HOST}:8080/
ProxyPassReverse / http://${DEMO_HOST}:8080/
