# A5 — HAProxy as a reverse proxy in front of the demo host.
#
# "${VAR}" is HAProxy's own environment substitution, so DEMO_HOST comes
# straight from the compose file.

global
    log stdout format raw local0 warning

defaults
    mode    http
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    option  http-keep-alive

frontend fe
    bind :80
    default_backend be

backend be
    server demo "${DEMO_HOST}:8080"
